name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  test-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check out pinned dataset
        uses: ./.github/actions/checkout-data
        with:
          ssh-key: ${{ secrets.DRAFT_DATA_DEPLOY_KEY }}
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify and rebuild saved data
        run: python scripts/update_datasets.py
      - name: Test
        run: npm test
      - name: Test companion bridge
        run: python -m unittest discover -s companion/tests
      - name: Test patch aggregation
        run: python -m unittest discover -s tests/python
      - name: Stage public site and combined dataset
        run: python -m scripts.build_pages build/pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    needs: test-and-upload
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
